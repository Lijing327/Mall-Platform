spring:
  datasource:
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    # 测试库连接（服务器）
    url: ${DB_TEST_URL:jdbc:sqlserver://127.0.0.1:1433;databaseName=mall_platform_test;encrypt=true;trustServerCertificate=true}
    username: ${DB_TEST_USERNAME:sa}
    password: ${DB_TEST_PASSWORD:change_me}

mybatis-plus:
  configuration:
    # 测试环境保留 SQL 日志，便于排查问题
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
