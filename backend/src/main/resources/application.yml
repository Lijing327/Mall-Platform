server:
  port: 8080

spring:
  application:
    name: mall-platform-backend
  profiles:
    # 默认使用测试环境，可通过启动参数覆盖为 prod
    active: test

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
  mapper-locations: classpath*:mapper/**/*.xml

# 说明：
# 1. 数据库连接已拆分到 application-test.yml 与 application-prod.yml。
# 2. 账号密码建议使用环境变量注入，避免明文写入仓库。
